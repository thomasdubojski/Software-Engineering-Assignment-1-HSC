{% extends 'base.html' %}

{% block title %}Add Review{% endblock %}

{% block heading %}Add a Food Review{% endblock %}

{% block text %}We value your contribution! Use the form below to add a new restaurant review.{% endblock %}

{% block content %}
<form action="/add_review" method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

    <!-- Restaurant dropdown -->
    <label for="name">Restaurant Name:</label>
    <select name="name" id="name" required>
        <option value="">Select a restaurant</option>
        <option value="McDonalds">McDonald's</option>
        <option value="KFC">KFC</option>
        <option value="Subway">Subway</option>
        <option value="Dominos">Domino's</option>
        <option value="Hungry Jack's">Hungry Jack's</option>
        <option value="Red Rooster">Red Rooster</option>
        <option value="Thai House">Thai House</option>
        <option value="Cafe 1876">Cafe 1876</option>
        <option value="Ribs & Burgers">Ribs & Burgers</option>
        <option value="The Fish Place">The Fish Place</option>
        <option value="Sizzler">Sizzler</option>
        <option value="Wok On Inn">Wok On Inn</option>
        <option value="Pizza Capers">Pizza Capers</option>
        <option value="The Oriental">The Oriental</option>
        <option value="The Bathurst Club">The Bathurst Club</option>
        <option value="The Royal Hotel">The Royal Hotel</option>
        <option value="Bistro 88">Bistro 88</option>
        <option value="Ritzy's Restaurant">Ritzy's Restaurant</option>
        <option value="La Petite Maison">La Petite Maison</option>
        <option value="Other">Other</option>
    </select>
    <br><br>

    <!-- Cuisine dropdown -->
    <label for="cuisine">Cuisine:</label>
    <select name="cuisine" id="cuisine" required>
    <option value="">Select cuisine</option>
    <option value="Italian">Italian</option>
    <option value="Chinese">Chinese</option>
    <option value="Indian">Indian</option>
    <option value="Thai">Thai</option>
    <option value="Japanese">Japanese</option>
    <option value="Cafe">Cafe</option>
    <option value="Fast Food">Fast Food</option>
    <option value="Mexican">Mexican</option>
    <option value="Vietnamese">Vietnamese</option>
    <option value="Other">Other</option>
    </select>
    <br><br>

    <!-- Rating -->
    <label>Rating:</label>
    <div class="star-rating">
        <input type="radio" name="review_score" id="star5" value="5"><label for="star5">★</label>
        <input type="radio" name="review_score" id="star4" value="4"><label for="star4">★</label>
        <input type="radio" name="review_score" id="star3" value="3"><label for="star3">★</label>
        <input type="radio" name="review_score" id="star2" value="2"><label for="star2">★</label>
        <input type="radio" name="review_score" id="star1" value="1"><label for="star1">★</label>
        <input type="radio" name="review_score" id="star0" value="0" checked hidden>
    </div>
    <br><br>

    <!-- Review text -->
    <label for="review_text">Review Text:</label><br>
    <textarea
        id="review_text"
        name="review_text"
        maxlength="100"
        required
        oninput="updateCounter()"
    ></textarea>
    <div id="char-counter">0 / 100</div>
    <br><br>

    <input type="submit" value="Submit Review">
</form>

<style>
.star-rating {
    direction: rtl;
    display: inline-block;
}
.star-rating input {
    display: none;
}
.star-rating label {
    font-size: 24px;
    cursor: pointer;
    color: black;
}
.star-rating input:checked ~ label,
.star-rating label:hover,
.star-rating label:hover ~ label {
    color: gold;
}

#char-counter {
    font-size: 14px;
}
</style>

<script>
function updateCounter() {
    const textarea = document.getElementById("review_text");
    const counter = document.getElementById("char-counter");
    const max = textarea.maxLength;
    const length = textarea.value.length;

    counter.textContent = `${length} / ${max}`;
    counter.style.color = length >= max ? "red" : "black";
}

document.querySelector("form").addEventListener("submit", function (e) {
    const text = document.getElementById("review_text").value.trim();
    if (text.length < 10) {
        alert("Review must be at least 10 characters long.");
        e.preventDefault();
    }
});

document.addEventListener("DOMContentLoaded", updateCounter);
</script>
{% endblock %}
